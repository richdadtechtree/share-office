<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캐릭터 미리보기 · 합동 AI 오피스</title>
<style>
  body{ margin:0; padding:22px; background:#0b0f15; color:#e8eef8;
        font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; }
  h2{ font-size:14px; letter-spacing:.08em; color:#8fa0b8; margin:22px 0 10px; font-weight:700; }
  .big{ display:flex; gap:26px; flex-wrap:wrap; }
  .big figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .big .art{ width:190px; height:214px; display:grid; place-items:center;
             background:radial-gradient(120% 120% at 50% 20%,#2a2018,#15110d);
             border-radius:18px; border:1px solid rgba(255,255,255,.08); }
  .big svg{ width:100%; height:100%; }
  .big figcaption{ font-size:11px; color:#9fb0c6; }
  .row{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
  .cell{ display:flex; flex-direction:column; align-items:center; gap:4px;
         padding:8px 10px; background:#141a24; border-radius:12px; border:1px solid rgba(255,255,255,.06); }
  .cell .t{ font-size:10px; color:#8fa0b8; }
  .av{ display:grid; place-items:center; border-radius:13px;
       background:radial-gradient(120% 120% at 50% 16%,#ffffff,#fbf5e9 46%,#ebdec9);
       box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.2); }
  .av.a40{ width:40px; height:40px; } .av.a40 svg{ height:33px; width:auto; }
  .av.a30{ width:30px; height:30px; border-radius:10px; } .av.a30 svg{ height:26px; width:auto; }
  .av.a21{ width:21px; height:21px; border-radius:7px; } .av.a21 svg{ height:18px; width:auto; }
  .lab{ font-size:11px; color:#8fa0b8; min-width:64px; }
  .mapbox{ position:relative; width:520px; height:290px; border-radius:16px;
    background:
      radial-gradient(60% 60% at 20% 20%,rgba(255,220,170,.10),transparent 70%),
      repeating-linear-gradient(90deg,#2a2118 0 26px,#2b2119 26px 28px);
    border:1px solid rgba(255,255,255,.08); overflow:hidden; }
  .char{ position:absolute; width:66px; height:74px; margin:0; padding:0; border:0; background:none;
    transform:translate(-50%,-100%); perspective:520px; }
  .char .body{ position:absolute; inset:0; display:grid; place-items:center; }
  .char .body svg{ width:100%; height:100%; display:block;
    filter:drop-shadow(0 7px 7px rgba(0,0,0,.5)); }
  .char .name{ position:absolute; top:calc(100% - 9px); left:50%; transform:translateX(-50%);
    display:inline-flex; align-items:center; gap:2px; max-width:126px; color:#1c2330;
    font-size:10px; font-weight:800; white-space:nowrap; }
  .char .name .nm{ display:block; max-width:100px; padding:1.5px 8px 1.5px 7px;
    border-radius:999px; background:#fff; color:#1c2330; overflow:hidden; text-overflow:ellipsis;
    box-shadow:0 5px 12px -6px rgba(0,0,0,.9); }
  .char .name .role{ font-style:normal; font-size:8px; line-height:1;
    display:grid; place-items:center; width:15px; height:15px; border-radius:50%;
    background:#fffdf7; order:-1; box-shadow:0 0 0 1px rgba(92,72,48,.18),0 3px 8px -3px rgba(0,0,0,.75); }
  .char .bubble{ position:absolute; bottom:calc(100% + 2px); left:50%; transform:translateX(-50%);
    display:inline-flex; align-items:center; gap:4px; max-width:168px; padding:3px 9px;
    border-radius:999px; background:rgba(17,24,39,.9); color:#eaf1fb;
    border:1px solid rgba(255,255,255,.14); font-size:10px; font-weight:600; white-space:nowrap; }
  .char .status-dot{ position:absolute; right:8px; bottom:10px; width:11px; height:11px;
    border-radius:50%; border:2px solid rgba(255,255,255,.9); background:#4caf6a; }
</style>
</head>
<body>
<h2>큰 그림 (190px)</h2>
<div class="big" id="big"></div>

<h2>맵 크기 이름표 (66×74)</h2>
<div class="mapbox" id="mapbox"></div>

<h2>아바타 아이콘 (40px · 30px · 21px)</h2>
<div class="row" id="sizes"></div>

<script src="config.js?v=pv7"></script>
<script src="app.js?v=pv7"></script>
<script>
(function () {
  var KINDS = [
    ['pickle', '피클', '#7cc48a', '작업 중', '💚'],
    ['claude', '클로드', '#eb9370', '집필 중', '🧡'],
    ['gpt', 'GPT', '#68bfb0', '대기 중', '🤍'],
    ['gemini', '제미나이', '#9a92ee', '자료 조사', '💙'],
    ['custom', '메이커봇', '#eec257', '작업 중', '💛']
  ];
  var api = window.OFFICE_APP || {};
  function svg(kind, color, small) {
    return api.characterSVG ? api.characterSVG(kind, color, small ? { small: true } : undefined)
      : '<b style="color:#f66">characterSVG 없음</b>';
  }
  document.getElementById('big').innerHTML = KINDS.map(function (k) {
    return '<figure><div class="art">' + svg(k[0], k[2]) + '</div><figcaption>' + k[1] + ' ' + k[2] + '</figcaption></figure>';
  }).join('');

  document.getElementById('mapbox').innerHTML = KINDS.map(function (k, i) {
    var x = 90 + i * 88, y = 150 + (i % 2 ? 54 : 0);
    return '<button class="char" style="left:' + x + 'px;top:' + y + 'px">' +
      (i === 0 ? '<span class="bubble">작업 중</span>' : '') +
      '<span class="body">' + svg(k[0], k[2], true) + '<i class="status-dot"></i></span>' +
      '<span class="name"><i class="role">' + k[4] + '</i><span class="nm">' + k[1] + '</span></span>' +
      '</button>';
  }).join('');

  document.getElementById('sizes').innerHTML = KINDS.map(function (k) {
    return '<div class="cell"><span class="lab">' + k[1] + '</span>' +
      '<span class="av a40">' + svg(k[0], k[2], true) + '</span>' +
      '<span class="av a30">' + svg(k[0], k[2], true) + '</span>' +
      '<span class="av a21">' + svg(k[0], k[2], true) + '</span></div>';
  }).join('');
})();
</script>
</body>
</html>
